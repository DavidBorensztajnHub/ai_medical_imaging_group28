  name: adam
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: cosine
augment:
- combined
train:
  epochs: 50
  batch_size: 8
  seed: 42
  num_workers: 5
  early_stopping:
    patience: null
    min_delta: 0.0
  sampler:
    empty_weight: 0.7
    class_weights:
      esophagus: 2.0
