  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  - nsd3
  postprocess:
  - name: largest_cc
    min_fraction: 0.1
wandb:
  enabled: true
  entity: ai4migroup28
  project: ai4mi-segthor
owner: Elena
