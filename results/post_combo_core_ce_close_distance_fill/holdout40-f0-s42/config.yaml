data:
  gt: data/segthor_full
  window:
  - 40
  - 400
  extra_windows: []
  target_spacing:
  - 0.98
  - 0.98
  - 2.0
  shape:
  - 384
  - 384
  split: holdout40
  fold: 0
input:
  context_slices: 0
model:
  name: enet
  params:
    kernels: 8
    factor: 2
  pretrained: false
loss:
  name: ce
regularizers: []
optimizer:
  name: adam
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: none
augment:
- combined
train:
  epochs: 25
  batch_size: 8
  seed: 42
  num_workers: 5
  early_stopping:
    patience: null
    min_delta: 0.0
eval:
  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  - nsd3
  postprocess:
  - name: closing
    radius_mm: 5
    axis: z
    skip:
    - heart
    - trachea
    - aorta
  - name: largest_cc
    max_distance_mm: 20
  - name: fill_holes
    per_slice: true
wandb:
  enabled: true
  entity: ai4migroup28
  project: ai4mi-segthor
owner: Elena
idea: 'Post-processing only (no training): post_native_close_distance_fill on combo_core_ce''s
  predictions. Close the esophagus along z (radius 5 mm), keep per organ the largest
  component plus everything within 20 mm of it, then fill holes per axial slice. On
  spacing_native_384 this beat min_fraction 0.1 on both seeds (HD95 12.5 -> 10.3 mm,
  ASSD 2.44 -> 2.17 mm, Dice +0.003). Compare against combo_core_ce''s metrics_3d_post
  (min_fraction 0.1).'
source: combo_core_ce
experiment: post_combo_core_ce_close_distance_fill
_run:
  config_file: configs/experiments/post_combo_core_ce_close_distance_fill.yaml
  overrides:
  - train.seed=42
  source_run: results/combo_core_ce/holdout40-f0-s42
  started: '2026-10-09T07:35:13'
  git:
    commit: 769c706
    branch: master
    dirty: true
