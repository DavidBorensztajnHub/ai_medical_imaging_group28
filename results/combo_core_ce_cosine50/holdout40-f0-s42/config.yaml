data:
  gt: data/segthor_full
  window:
  - 40
  - 400
  extra_windows: []
  target_spacing:
  - 0.98
  - 0.98
  - 2.0
  shape:
  - 384
  - 384
  split: holdout40
  fold: 0
input:
  context_slices: 0
