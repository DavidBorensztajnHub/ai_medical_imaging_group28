data:
  gt: data/segthor_full
  window:
  - 40
  - 400
  extra_windows: []
  target_spacing:
  - 0.98
  - 0.98
  - 2.0
  shape:
  - 384
  - 384
  split: holdout40
  fold: 0
input:
  context_slices: 0
model:
  name: enet
  params:
    kernels: 8
    factor: 2
  pretrained: false
loss:
  name: ce
regularizers: []
optimizer:
  name: adam
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: none
augment:
- combined
train:
  epochs: 25
  batch_size: 8
  seed: 43
  num_workers: 5
  early_stopping:
    patience: null
    min_delta: 0.0
eval:
  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  - nsd3
  postprocess:
  - name: closing
    radius_mm: 5
    axis: z
    skip:
    - heart
    - trachea
    - aorta
  - name: largest_cc
    min_fraction: 0.1
wandb:
  enabled: true
  entity: ai4migroup28
  project: ai4mi-segthor
owner: Elena
idea: 'Post-processing only (no training): post_combo_core_ce_close_lcc on combo_core_ce_k16''s
  predictions (the best model so far). Close the esophagus along z (radius 5 mm),
  then largest_cc with min_fraction 0.1. Compare against combo_core_ce_k16''s metrics_3d_post
  (min_fraction 0.1 only).'
source: combo_core_ce_k16
experiment: post_combo_core_ce_k16_close_lcc
_run:
  config_file: configs/experiments/post_combo_core_ce_k16_close_lcc.yaml
  overrides:
